name: Publish AHA Website

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Prepare website
        shell: python
        run: |
          from pathlib import Path
          import shutil

          shutil.copytree("production-build", "_site")
          root = Path("_site")
          base = "/AHA-Website"

          for file in root.rglob("*"):
              if file.suffix not in {".html", ".css", ".js"}:
                  continue
              text = file.read_text()
              if file.suffix == ".html":
                  text = text.replace('"/assets/', f'"{base}/assets/')
                  text = text.replace('"/favicon.svg"', f'"{base}/favicon.svg"')
              elif file.suffix == ".css":
                  text = text.replace("url(/assets/", f"url({base}/assets/")
                  text = text.replace('url("/assets/', f'url("{base}/assets/')
              elif file.suffix == ".js":
                  text = text.replace('base:"/",children:', f'base:"{base}",children:')
                  text = text.replace('`/images/${', '`' + base + '/images/${')
              file.write_text(text)

          shutil.copyfile(root / "index.html", root / "404.html")
          (root / ".nojekyll").touch()

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
